<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>智耘云 PC 端</title>
    <script>
      /* GitHub Pages SPA hack：深链接 404 时跳回首页 */
      (function () {
        var path = window.location.pathname.replace(/\/404\.html$/, "");
        window.location.replace(
          path.slice(0, path.lastIndexOf("/") + 1) + "index.html"
        );
      })();
    </script>
  </head>
  <body></body>
</html>
